name: MCP Server Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/mcp-server-tests.yml'

jobs:
  mcp-server-unit-tests:
    name: MCP Server Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mediainfo libsndfile1
          ffmpeg -version

      - name: Setup test directories
        run: |
          sudo mkdir -p /tmp/pulse/ffmpeg-mcp/{generated-videos,youtube-downloads,test-files,source,temp,screenshots,metadata,ci-workflow}
          sudo mkdir -p /tmp/music/{source,temp,metadata,screenshots}
          sudo chmod -R 777 /tmp/pulse /tmp/music
          cp tests/files/* /tmp/pulse/ffmpeg-mcp/source/ 2>/dev/null || true
          cp tests/files/* /tmp/music/source/ 2>/dev/null || true

      - name: Generate CI test videos
        run: |
          mkdir -p tests/files
          ffmpeg -f lavfi -i testsrc2=duration=5:size=1280x720:rate=25 -pix_fmt yuv420p -c:v libx264 -y tests/files/JJVtt947FfI_136.mp4
          ffmpeg -f lavfi -i testsrc2=duration=5:size=720x1280:rate=25 -pix_fmt yuv420p -c:v libx264 -y tests/files/_wZ5Hof5tXY_136.mp4

      - name: Run CI unit tests
        run: |
          uv run pytest tests/ci/test_unit_core.py tests/ci/test_integration_basic.py -v --tb=short
          uv run python tests/test_basic_ci.py

      - name: Test MCP server import
        run: uv run python -c "import src.server; print('MCP server imports successfully')"

  mcp-test-documentation:
    name: Test Documentation Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          required=(
            README.md
            CLAUDE.md
            pyproject.toml
            src/server.py
            VIDEO_FORMAT_STRATEGY.md
            tests/test_basic_ci.py
            docs/FASTTRACK_COMPLETE_GUIDE.md
            docs/INTEGRATION_GUIDE.md
          )
          for file in "${required[@]}"; do
            if [[ -e "$file" ]]; then
              echo "OK: $file"
            else
              echo "Missing: $file"
              exit 1
            fi
          done

      - name: Validate README content
        run: |
          grep -q "ismailubts/pulse-ffmpeg-mcp" README.md
          grep -q "uv sync" README.md
          grep -q "src.server" README.md
